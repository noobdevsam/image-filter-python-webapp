<div class="container">
  <h2>Digital Image Processing Workbench</h2>

  <div class="toolbar">
    <input type="file" (change)="onFileSelected($event)" accept="image/*">

    <select [(ngModel)]="selectedFilter" (change)="onFilterChange()">
      <optgroup label="Smoothing & Sharpening Filters">
        <option value="average">Box Blur (Average)</option>
        <option value="median">Median Blur</option>
        <option value="gaussian">Gaussian Blur</option>
        <option value="sharpen">Sharpening Kernel</option>
      </optgroup>
      <optgroup label="Spatial Domain Filtering">
        <option value="laplacian">Laplacian Edge Detection</option>
        <option value="sobel">Sobel Edge Magnitude</option>
      </optgroup>
      <optgroup label="Gray-Level Transformations">
        <option value="invert">Invert Image</option>
        <option value="brightness">Adjust Brightness</option>
        <option value="contrast">Adjust Contrast</option>
      </optgroup>
      <optgroup label="Histogram Processing">
        <option value="histogram">Histogram Equalization</option>
      </optgroup>
    </select>

    <div class="slider-box" *ngIf="['average', 'median', 'gaussian'].includes(selectedFilter)">
      <label>Kernel Size: {{ filterParam }}</label>
      <input type="range" min="1" max="31" step="2" [(ngModel)]="filterParam">
    </div>

    <div class="slider-box" *ngIf="selectedFilter === 'brightness'">
      <label>Offset: {{ filterParam }}</label>
      <input type="range" min="-100" max="100" step="5" [(ngModel)]="filterParam">
    </div>

    <div class="slider-box" *ngIf="selectedFilter === 'contrast'">
      <label>Factor: {{ filterParam }}</label>
      <input type="range" min="0.2" max="3.0" step="0.1" [(ngModel)]="filterParam">
    </div>

    <button (click)="applyFilter()" [disabled]="!selectedFile || isLoading">
      {{ isLoading ? 'Processing...' : 'Apply Filter' }}
    </button>

    <button (click)="saveImage()" [disabled]="!processedImageSrc">Save Image</button>
  </div>

  <div class="view-panel">
    <div class="box">
      <h3>Before (Original)</h3>
      <div class="image-wrapper">
        <img *ngIf="originalImageSrc" [src]="originalImageSrc" alt="Original Upload">
      </div>
    </div>
    <div class="box">
      <h3>After (Processed)</h3>
      <div class="image-wrapper">
        <img *ngIf="processedImageSrc" [src]="processedImageSrc" alt="Filtered Output">
      </div>
    </div>
  </div>
</div>
